<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改参数')"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-config-edit" th:object="${config}">
        <input id="configId" name="configId" th:field="*{configId}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label">作者：</label>
            <div class="col-sm-8">
                <input class="form-control" id="author" name="author" required th:field="*{author}" type="text">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">生成模块路径：</label>
            <div class="col-sm-8">
                <input class="form-control" id="moduleName" name="moduleName" required th:field="*{moduleName}"
                       type="text">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">生成包路径：</label>
            <div class="col-sm-8">
                <input class="form-control" id="packageName" name="packageName" th:field="*{packageName}"
                       type="text">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">去除表前缀：</label>
            <div class="col-sm-8">
                <div class="radio-box">
                    <input id="rd1" name="autoRemovePre" th:field="*{autoRemovePre}" type="radio" value="1"><label
                        for="rd1">是</label>
                </div>
                <div class="radio-box">
                    <input id="rd2" name="autoRemovePre" th:field="*{autoRemovePre}" type="radio" value="0"><label
                        for="rd2">否</label>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">表前缀：</label>
            <div class="col-sm-8">
                <input class="form-control" id="tablePrefix" name="tablePrefix" required th:field="*{tablePrefix}"
                       type="text">
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<script type="text/javascript">
    var prefix = ctx + "system/config";

    $("#form-config-edit").validate({
        onkeyup: false,
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/save", $('#form-config-edit').serialize());
        }
    }
</script>
</body>
</html>
