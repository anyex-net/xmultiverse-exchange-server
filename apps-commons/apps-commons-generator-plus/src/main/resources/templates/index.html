    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>

<body class="fixed-sidebar full-height-layout gray-bg skin-blue theme-dark" style="overflow: hidden">
<div id="wrapper">
    <!--右侧部分开始-->
    <div class="gray-bg dashbard-1" id="page-wrapper">
        <div class="row border-bottom">
            <nav class="navbar navbar-static-top" role="navigation" style="margin-bottom: 0">
                <div class="navbar-header" style="width: 20%;"><p

                <ul class="nav navbar-top-links navbar-right welcome-message">
                    <li><a class="menuItem" data-placement="bottom" data-toggle="tooltip" data-trigger="hover"
                           th:href="@{/system/dict}" title="字典管理"><i class="fa fa-cog"></i> 字典管理</a></li>
                    <li><a class="menuItem" data-placement="bottom" data-toggle="tooltip" data-trigger="hover"
                           onclick="sysConfig()" title="系统配置"><i class="fa fa-cog"></i> 系统配置</a></li>
                    <li><a class="menuItem" data-placement="bottom" data-toggle="tooltip" data-trigger="hover"
                           th:href="@{/system/dataSource}" title="数据源设置"><i class="fa fa-database"></i> 数据源</a></li>
                </ul>
            </nav>
        </div>
        <div class="row content-tabs">
            <button class="roll-nav roll-left tabLeft">
                <i class="fa fa-backward"></i>
            </button>
            <nav class="page-tabs menuTabs">
                <div class="page-tabs-content">
                    <a class="active menuTab" data-id="/tool/gen" href="javascript:;">代码生成</a>

            </nav>
            <button class="roll-nav roll-right tabRight">

        <a class="ax_close_max" href="#" id="ax_close_max" title="关闭全屏"> <i class="fa fa-times-circle-o"></i> </a>

        <div class="row mainContent" id="content-main">
            <iframe class="RuoYi_iframe" frameborder="0" height="100%" name="iframe0" seamless
                    th:data-id="@{/tool/gen}" th:src="@{/tool/gen}" width="100%"></iframe>
        </div>
        <div class="footer">
            <div class="pull-right">© 2019-2021 RuoYi Copyright</div>
        </div>
    </div>
    <!--右侧部分结束-->
</div>
<!-- 全局js -->
<script th:src="@{/js/jquery.min.js}"></script>
<script th:src="@{/js/bootstrap.min.js}"></script>
<script th:src="@{/js/plugins/metisMenu/jquery.metisMenu.js}"></script>
<script th:src="@{/js/plugins/slimscroll/jquery.slimscroll.min.js}"></script>
<script th:src="@{/js/jquery.contextMenu.min.js}"></script>
<script th:src="@{/ajax/libs/blockUI/jquery.blockUI.js}"></script>
<script th:src="@{/ajax/libs/layer/layer.min.js}"></script>
<script th:src="@{/ruoyi/js/ry-ui.js?v=4.6.0}"></script>
<script th:src="@{/ruoyi/js/common.js?v=4.6.0}"></script>
<script th:src="@{/ruoyi/index.js?v=20201208}"></script>
<script th:src="@{/ajax/libs/fullscreen/jquery.fullscreen.js}"></script>
<script th:inline="javascript">
    var ctx = [[@{/}]];
    // history(表示去掉地址的#)否则地址以"#"形式展示
    var mode = "history";
    // 历史访问路径缓存
    var historyPath = storage.get("historyPath");
    // 是否页签与菜单联动
    var isLinkage = true;

    /** 刷新时访问路径页签 */
    function applyPath(url) {
        $('a[href$="' + decodeURI(url) + '"]').click();
        if (!$('a[href$="' + url + '"]').hasClass("noactive")) {
            $('a[href$="' + url + '"]').parent("li").addClass("selected").parents("li").addClass("active").end().parents("ul").addClass("in");
        }
    }

    $(function () {
        if ($.common.equals("history", mode) && window.performance.navigation.type == 1) {
            var url = storage.get('publicPath');
            if ($.common.isNotEmpty(url)) {
                applyPath(url);
            }
        } else {
            var hash = location.hash;
            if ($.common.isNotEmpty(hash)) {
                var url = hash.substring(1, hash.length);
                applyPath(url);
            } else {
                if ($.common.equals("history", mode)) {
                    storage.set('publicPath', "");
                }
            }
        }
        $("[data-toggle='tooltip']").tooltip();
    });

    /*系统配置*/
    function sysConfig() {
        var url = ctx + 'system/config';
        $.modal.open("系统配置", url, '', 400);
    }
</script>
</body>
</html>
