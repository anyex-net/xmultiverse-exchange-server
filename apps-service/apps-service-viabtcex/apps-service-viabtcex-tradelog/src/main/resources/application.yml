# 指定log4j2作为日志记录
logging:
  config: classpath:log4j2.xml
  level:
    #这个指定你的dao层，也就是mapper文件的所在包
    com.anyex.apps/**/mapper: debug
pagehelper:
  helper-dialect: @database.sql.dialect@
  reasonable: false
  support-methods-arguments: true
  params: count=countSql
com:
  amazon:
    ses:
      host: @amazon.ses.host@
      port: @amazon.ses.port@
      provider: @amazon.ses.provider@
      biex:
        personal: @amazon.ses.biex.personal@
        username: @amazon.ses.biex.username@
        password: @amazon.ses.biex.password@
        fromuser: @amazon.ses.biex.fromuser@
      bitms:
        personal: @amazon.ses.bitms.personal@
        username: @amazon.ses.bitms.username@
        password: @amazon.ses.bitms.password@
        fromuser: @amazon.ses.bitms.fromuser@
  anyex:
    env: @env@
    withDrawInterfaceSwitch: @withdraw.interface.switch@
    wivpay:
      payUrl: @wivpay.payUrl@
      payQueryUrl: @wivpay.payQueryUrl@
      redirectUrl: @wivpay.redirectUrl@
      notifyUrl: @wivpay.notifyUrl@
      merchantSn: @wivpay.merchantSn@
      merchantAk: @wivpay.merchantAk@
      merchantSk: @wivpay.merchantSk@
      channelAliasName: @wivpay.channelAliasName@
    globalpay:
      rootUrl: @globalpay.rootUrl@
      mchno: @globalpay.mchno@
      appid: @globalpay.appid@
      payInNotifyUrl: @globalpay.payInNotifyUrl@
      payOutNotifyUrl: @globalpay.payOutNotifyUrl@
      key: @globalpay.key@
    sms:
      host: @sms.send.host@
      user: @sms.send.user@
      pass: @sms.send.pass@
      inthost: @sms.send.inthost@
      intuser: @sms.send.intuser@
      intpass: @sms.send.intpass@
      signature:
        en: 签名
        cn: 签名
    weiXin:
      app-key: @weixin.appkey@
      secret: @weixin.secret@
      open:
        app-key: @weixin.open.appkey@
        secret: @weixin.open.secret@
    jPush:
      app-key: @jpush.appkey@
      secret: @jpush.secret@
  alipay:
    sofa:
      rpc:
        registry-address: @zookeeper.address@
        boltPort: 12321 #12310
      tracer:
        disableDigestLog: true #是否关闭所有集成 SOFATracer 组件摘要日志打印
        tracerGlobalLogReserveDay: 1 #SOFATracer 日志的保留天数
openim:
  apiRoot: @openim.apiRoot@
  #  下面可以不配置，默认按以下规则生成 后续开发 请到Openimconfig文件中添加
  #  apiRoot: http://openim-web.host.fit/api
  #  chatRoot: http://openim-web.host.fit/chat
  #  adminRoot: http://openim-web.host.fit/complete_admin
  secret: @openim.secret@
  adminAccount: @openim.adminAccount@
  adminPwd: @openim.adminPwd@
  #预留功能，支持每个请求，自动带个header authKey参数
  authKey: @openim.authKey@
