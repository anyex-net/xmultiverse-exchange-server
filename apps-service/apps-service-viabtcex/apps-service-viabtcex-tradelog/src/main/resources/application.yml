spring:
  main:
    web-application-type: none
    allow-circular-references: true
  cache:
    type: redis
  application:
    name: AppsRPCServer-viabtcex-tradelog
  data:
    mongodb:
      host: @mongodb.host@
      port: @mongodb.port@
      database: @mongodb.database@
  redis:
    cluster:
      nodes: @cluster.nodes@
      max-redirects: 3
    host: @redis.host@
    port: @redis.port@
    password: @redis.password@
    timeout: @redis.timeout@
    conn-type: @redis.conntype@ # cluster/single
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 2
        # 连接池中的最大空闲连接
        max-idle: 200
        # 连接池最大连接数（使用负值表示没有限制）
        max-active: 2000
        # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: 10000
  datasource:
    master:
      jdbc-url: jdbc:mysql://112.14.45.72:3306/trade_log?useSSL=false&serverTimezone=UTC
      username: skyadmin
      password: FrmnK9upBcKWPvkFvkUSkTkwQbIfhb3s+spaWHO4d4k=
      min-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      # 50 开发阶段用10
      maximum-pool-size: 10
      connection-timeout: 30000
      driver-class-name: com.mysql.cj.jdbc.Driver #dm.jdbc.driver.DmDriver
      connection-test-query: SELECT 1
    slave1:
      jdbc-url: @slave1.jdbc.url@
      pool-name: @slave1.jdbc.poolname@
      username: @slave1.jdbc.username@
      password: @slave1.jdbc.password@
      min-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      # 50 开发阶段用10
      maximum-pool-size: 10
      connection-timeout: 30000
      driver-class-name: com.mysql.cj.jdbc.Driver #dm.jdbc.driver.DmDriver
      connection-test-query: SELECT 1
  mail:
    host: @email.host@
    port: 465 # SSL配置
    default-encoding: UTF-8
    username: @email.username@
    password: @email.password@
    test-connection: false
    properties:
      mail:
        smtp:
          auth: true # 需要验证登录名和密码
          ssl:
            enable: true
          starttls:
            enable: true # 需要TLS认证 保证发送邮件安全验证
            required: true
#  activiti:
#    #检测历史表是否存在 activiti7默认没有开启数据库历史记录 启动数据库历史记录
#    db-history-used: true
#    #默认none,full：保存历史数据的最高级别，除了会保存audit级别的数据外，还会保存其他全部流程相关的细节数据，包括一些流程参数等。
#    history-level: full
#    #默认:true,activiti会对数据库中所有表进行更新操作。如果表不存在，则自动创建,测试场景使用
#    #flase,activiti在启动时，对比数据库表中保存的版本，如果没有表或者版本不匹配，将抛出异常
#    database-schema-update: true
